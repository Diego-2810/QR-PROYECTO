<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Alexis - Servicio Ejecutivo de Traslados</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b1329 0%, #1e293b 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-yellow: #f59e0b;
            --accent-green: #25d366;
            --accent-green-hover: #1da851;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0;
            margin: 0;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(245, 158, 11, 0.15);
        }

        .brand-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.75rem;
            color: #0f172a;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
        }

        .btn-lang {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            border-radius: 12px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-lang.active, .btn-lang:hover {
            background: var(--accent-yellow);
            border-color: var(--accent-yellow);
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .subtitle-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-block;
        }

        .list-group-custom .list-group-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-radius: 12px !important;
            margin-bottom: 8px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .list-group-custom .list-group-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .service-icon {
            color: var(--accent-yellow);
            font-size: 1.1rem;
        }

        .whatsapp-btn {
            background: var(--accent-green);
            border: none;
            color: white;
            border-radius: 16px;
            padding: 16px 28px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background: var(--accent-green-hover);
            color: white;
            box-shadow: 0 14px 30px rgba(37, 211, 102, 0.45);
            transform: translateY(-2px);
        }

        .spinner-container {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="glass-card p-4 p-md-5">
                    
                    <!-- Selector de Idiomas -->
                    <div class="d-flex justify-content-end gap-2 mb-4">
                        <button class="btn btn-lang active" onclick="loadProfile('es')" id="btn-es">ES</button>
                        <button class="btn btn-lang" onclick="loadProfile('en')" id="btn-en">EN</button>
                        <button class="btn btn-lang" onclick="loadProfile('pt')" id="btn-pt">PT</button>
                    </div>

                    <!-- Contenedor dinámico del Perfil de Taxi Alexis -->
                    <div id="profile-content">
                        <div class="spinner-container text-center">
                            <div class="spinner-border" role="status" style="color: var(--accent-yellow);">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-3 text-secondary" id="loading-text">Cargando servicios...</p>
                        </div>
                    </div>

                </div>

                <div class="text-center mt-4 text-secondary small">
                    <p class="mb-0">Taxi Alexis &copy; 2026 | Servicio de Traslados</p>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const btnTexts = {
            es: "Reservar por WhatsApp",
            en: "Book via WhatsApp",
            pt: "Reservar pelo WhatsApp"
        };

        const errorTexts = {
            es: "No se pudieron cargar los servicios de Taxi Alexis.",
            en: "Could not load Taxi Alexis services.",
            pt: "Não foi possível carregar os serviços do Taxi Alexis."
        };

        async function loadProfile(lang) {
            // Activar botón de idioma seleccionado
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');

            const container = document.getElementById('profile-content');
            container.innerHTML = `
                <div class="spinner-container text-center">
                    <div class="spinner-border" role="status" style="color: var(--accent-yellow);">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            `;

            try {
                const response = await fetch(`/api/profile/${lang}`);
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                const profile = await response.json();

                // Separar la lista de servicios por coma (,)
                const servicesList = profile.services
                    ? profile.services.split(',').map(s => s.trim()).filter(s => s.length > 0)
                    : [];

                const servicesHtml = servicesList.map(service => `
                    <li class="list-group-item">
                        <i class="bi bi-check-circle-fill service-icon"></i>
                        <span>${escapeHtml(service)}</span>
                    </li>
                `).join('');

                const cleanWhatsApp = profile.whatsApp ? profile.whatsApp.replace(/[^0-9]/g, '') : '';
                const whatsappUrl = `https://wa.me/${cleanWhatsApp}`;
                const buttonText = btnTexts[lang] || btnTexts.es;

                container.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="brand-icon mb-3">
                            <i class="bi bi-taxi-front-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-2">${escapeHtml(profile.businessName)}</h2>
                        <div class="mb-3">
                            <span class="subtitle-badge">
                                <i class="bi bi-shield-check me-1"></i> ${escapeHtml(profile.coreValues)}
                            </span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h6 class="text-uppercase text-secondary fw-semibold mb-3 px-1" style="letter-spacing: 1px; font-size: 0.8rem;">
                            <i class="bi bi-card-checklist me-1"></i> Servicios Disponibles
                        </h6>
                        <ul class="list-group list-group-custom">
                            ${servicesHtml}
                        </ul>
                    </div>

                    <div class="mt-4">
                        <a href="${whatsappUrl}" target="_blank" class="whatsapp-btn">
                            <i class="bi bi-whatsapp fs-4"></i> ${buttonText}
                        </a>
                    </div>
                `;
            } catch (error) {
                console.error('Error al obtener el perfil de Taxi Alexis:', error);
                const errorMsg = errorTexts[lang] || errorTexts.es;
                container.innerHTML = `
                    <div class="alert alert-danger bg-danger bg-opacity-25 text-white border-danger border-opacity-50 rounded-4 p-4 mt-3 text-center">
                        <i class="bi bi-exclamation-triangle-fill fs-3 mb-2 d-block"></i>
                        <p class="mb-0 fw-semibold">${errorMsg}</p>
                        <small class="text-secondary d-block mt-2">Asegúrate de haber ejecutado el script SQL en MySQL.</small>
                    </div>
                `;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Cargar por defecto en español
        document.addEventListener('DOMContentLoaded', () => loadProfile('es'));
    </script>
</body>
</html>
